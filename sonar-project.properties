sonar.projectKey=ffreis-website-compiler
sonar.organization=felipefuhr
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
# testdata/ holds fixtures (golden HTML, YAML, fuzz corpus, etc.), not
# maintained source — Go's own tooling already excludes it from build/vet.
# Without this, near-identical generated golden HTML across paginated test
# fixtures (by design: same template, different mock content) trips the
# duplicated-lines gate on new code, e.g. PR #110's goldensite fixtures.
sonar.exclusions=**/testdata/**
