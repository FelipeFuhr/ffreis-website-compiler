name: DevOps / Go CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    permissions:
      contents: read
      pull-requests: read # for golangci-lint-action
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-quick-checks.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [quick-checks]
    permissions:
      contents: read
      # go-test.yml@v1.4.0's job requests id-token: write for its L2 S3
      # cache OIDC step (no-op when go-cache-s3 is false) — a reusable
      # workflow's job can't request a permission the caller doesn't grant,
      # or GitHub rejects the run outright with a startup_failure.
      id-token: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      run-govulncheck: false

  # Whole-module (./...) line-coverage gate. Threshold 68, not the fleet's
  # usual 75: this is a real, currently-passing floor (measured 69.3% after
  # backfilling internal/pagination, internal/validatesanitycmd and
  # internal/servecmd), not an aspirational one — see the COVERAGE_MIN
  # comment in the Makefile. Keep this in sync with the Makefile's
  # COVERAGE_MIN; they are two separate enforcement points for the same
  # ratchet.
  coverage:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [quick-checks]
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      coverage-threshold: 68

  # Replaces the old vacuous "integration" job (go-test.yml + test-tags:
  # integration): zero files anywhere carry the //go:build integration tag,
  # so that job silently re-ran the normal unit suite under a different
  # label. This reusable workflow detects the same condition and skips with
  # an honest ::notice:: instead of a false pass.
  integration-coverage:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [quick-checks]
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-integration-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      coverage-threshold: 75
