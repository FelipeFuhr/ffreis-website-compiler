name: DevOps / Automation

on:
  schedule:
    - cron: "7 1 2 * *"  # monthly scattered (was: 0 3 * * 0)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: vars.SCORECARD_ENABLED == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    # Pin bumped v1.1.0 -> v1.9.0 alongside wiring up release-please below —
    # the old pin predates the `runner` input, so bringing it forward here
    # keeps all three jobs in this file on one consistent, supported version.
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      upload-sarif: true
      runner: '["self-hosted","local"]'

  stale:
    if: vars.STALE_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      only: "both"
      runner: '["self-hosted","local"]'

  release-please:
    if: vars.RELEASE_PLEASE_ENABLED == 'true' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-release-please.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      target-branch: "main"
      runner: '["self-hosted","local"]'
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
